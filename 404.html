<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Christian Morey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500&family=Source+Sans+3:wght@400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#FBFAF8; --ink:#1B1917; --ink-muted:#6E675C;
  --rule:#DAD4C8; --link:#14566B; --accent:#9B3B28;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1A1815; --ink:#ECE7DE; --ink-muted:#A79F91;
    --rule:#3B362C; --link:#7CBED0; --accent:#D87C63;
  }
}
:root[data-theme="dark"]{
  --paper:#1A1815; --ink:#ECE7DE; --ink-muted:#A79F91;
  --rule:#3B362C; --link:#7CBED0; --accent:#D87C63;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Source Sans 3",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.62;
}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.nf{max-width:34rem;margin:0 auto;padding:6rem 1.5rem}
.code{
  font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin:0 0 .9rem;
}
h1{
  font-family:"Spectral","Iowan Old Style",Georgia,"Times New Roman",serif;
  font-weight:500;font-size:clamp(2rem,1.4rem + 2vw,2.75rem);
  letter-spacing:-.02em;margin:0 0 .6rem;line-height:1.1;text-wrap:balance;
}
p{color:var(--ink-muted);margin:0 0 1.4rem}
hr{border:none;border-top:1px solid var(--rule);margin:1.8rem 0}
</style>
</head>
<body>
<main class="nf">
  <p class="code">Error 404</p>
  <h1>This article does not exist</h1>
  <p>The page you asked for isn&rsquo;t here. It may have been renamed, or the link may be wrong.</p>
  <hr>
  <p><a href="/">&larr; Return to the main article</a></p>
</main>
</body>
</html>
